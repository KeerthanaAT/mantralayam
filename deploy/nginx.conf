# nginx alternative to Caddy. TLS certificates come from certbot (Let's Encrypt):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d rooms.example.org -d staff.example.org      # also sets up automatic renewal
# Put this file in /etc/nginx/conf.d/mantralayam.conf, replace the host names and the staff addresses, then: sudo nginx -t && sudo systemctl reload nginx
#
# Important: X-Forwarded-For is SET to the connecting address ($remote_addr), never appended to what the visitor sent,
# so the apps can trust it (TRUST_PROXY=1). The apps add HSTS and the other security headers themselves (MANTRALAYAM_HTTPS=1).

limit_req_zone $binary_remote_addr zone=mantralayam:10m rate=20r/s;

# Access log without the query string (guest mobile numbers and booking codes travel in a few staff URLs): $uri has no query.
log_format mantralayam '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# A slow client is cut off here, before it can hold one of the app's threads (slowloris).
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 60s;

server {
	listen 80;
	listen [::]:80;
	server_name rooms.example.org staff.example.org;
	location /.well-known/acme-challenge/ { root /var/www/html; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name rooms.example.org;
	# certbot fills in ssl_certificate and ssl_certificate_key
	ssl_protocols TLSv1.2 TLSv1.3;
	server_tokens off;
	client_max_body_size 64k;
	limit_req zone=mantralayam burst=40 nodelay;
	access_log /var/log/nginx/mantralayam-rooms.log mantralayam;

	location / {
		proxy_pass http://127.0.0.1:8001;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name staff.example.org;
	ssl_protocols TLSv1.2 TLSv1.3;
	server_tokens off;
	client_max_body_size 64k;
	limit_req zone=mantralayam burst=40 nodelay;
	access_log /var/log/nginx/mantralayam-staff.log mantralayam;

	# The staff app is for the people who work at the property, not for the internet: only your VPN (Tailscale/WireGuard) and,
	# if you want, the office's fixed address. Replace the example ranges before you go live; everyone else gets 403.
	allow 100.64.0.0/10;
	allow 192.0.2.0/24;
	deny all;

	# Only the two photo uploads (an ID photo, a room photo) may be a few megabytes.
	location ~ ^/api/(bookings/[0-9]+/id_image|admin/room_types/[0-9]+/photo)$ {
		client_max_body_size 4m;
		proxy_pass http://127.0.0.1:8002;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}

	location / {
		proxy_pass http://127.0.0.1:8002;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}
}
