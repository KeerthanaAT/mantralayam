<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Staff · Mantralayam Rooms</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/staff.css">
</head>
<body>
<a class="skip" href="#view">Skip to main content</a>

<header class="top" id="chrome" hidden>
  <div class="bar">
    <div class="brand">
      <img src="/images/logo-transparent.png" alt="" width="56" height="56">
      <span>Mantralayam Rooms<small>Staff</small></span>
    </div>
    <nav class="main" id="nav" aria-label="Staff">
      <ul id="navlist"></ul>
    </nav>
    <div class="who" id="who"></div>
    <button class="btn" id="signout" type="button">Sign out</button>
  </div>
</header>

<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="bdlg" aria-labelledby="bdlg-h">
  <form id="bform" method="dialog" novalidate>
    <h2 id="bdlg-h">New booking (walk-in)</h2>
    <div class="row">
      <div><label for="b_prop" class="req">Property</label><select id="b_prop" name="property_id" required></select></div>
      <div><label for="b_room" class="req">Room</label><select id="b_room" name="room_id" required></select></div>
    </div>
    <div class="row">
      <div><label for="b_in" class="req">Check-in</label><input id="b_in" name="check_in" type="date" required></div>
      <div><label for="b_out" class="req">Check-out</label><input id="b_out" name="check_out" type="date" required></div>
    </div>
    <p class="hint" id="b_hint">Rooms show their status on the check-in date. The server checks the whole stay.</p>
    <div id="b_alt" aria-live="polite" hidden></div>
    <div><label for="b_name" class="req">Guest name</label><input id="b_name" name="guest_name" required maxlength="100" autocomplete="off"></div>
    <div class="row">
      <div><label for="b_phone" class="req">Mobile number</label><input id="b_phone" name="phone" type="tel" required inputmode="tel" maxlength="20" autocomplete="off"></div>
      <div><label for="b_guests" class="req">Guests</label><input id="b_guests" name="guests" type="number" min="1" max="200" value="1" required inputmode="numeric"></div>
    </div>
    <div class="row">
      <div><label for="b_idtype" class="req">ID proof type</label><select id="b_idtype" name="id_type" required></select></div>
      <div><label for="b_idno" class="req">ID proof number</label><input id="b_idno" name="id_number" required maxlength="30" autocomplete="off"></div>
    </div>
    <div class="row">
      <div><label for="b_arrive">Expected arrival time (optional)</label><input id="b_arrive" name="arrival_time" type="time"></div>
      <div><label for="b_darshan">Darshan date (optional)</label><input id="b_darshan" name="darshan_date" type="date"></div>
    </div>
    <div><label for="b_remarks">Remarks (optional)</label><textarea id="b_remarks" name="remarks" maxlength="500"></textarea></div>
    <p id="b_err" class="msg error" role="alert" hidden></p>
    <div class="foot">
      <button type="button" class="btn secondary" id="b_back">Close</button>
      <button type="submit" class="btn" id="b_submit">Create booking</button>
    </div>
  </form>
</dialog>

<dialog id="cdlg" aria-labelledby="cdlg-h">
  <form id="cform" method="dialog">
    <h2 id="cdlg-h">Cancel booking</h2>
    <p class="muted" id="c_intro"></p>
    <div><label for="c_reason" class="req">Reason for cancellation</label><textarea id="c_reason" required maxlength="300"></textarea></div>
    <p id="c_err" class="msg error" role="alert" hidden></p>
    <div class="foot">
      <button type="button" class="btn secondary" id="c_back">Keep booking</button>
      <button type="submit" class="btn danger" id="c_submit">Cancel booking</button>
    </div>
  </form>
</dialog>

<dialog id="kdlg" aria-labelledby="kdlg-h">
  <form id="kform" method="dialog">
    <h2 id="kdlg-h">Change room status</h2>
    <div class="row">
      <div><label for="k_prop" class="req">Property</label><select id="k_prop" required></select></div>
      <div><label for="k_room" class="req">Room</label><select id="k_room" name="room_id" required></select></div>
    </div>
    <div class="row">
      <div><label for="k_kind" class="req">Status</label><select id="k_kind" name="kind" required></select></div>
      <div id="k_cat_box"><label for="k_cat" class="req">Issue category</label><select id="k_cat" name="issue_category"></select></div>
    </div>
    <div class="row">
      <div><label for="k_start" class="req">From</label><input id="k_start" name="start_date" type="date" required></div>
      <div><label for="k_end" id="k_end_l">Available again on</label><input id="k_end" name="end_date" type="date"></div>
    </div>
    <div><label for="k_reason" class="req">Reason</label><textarea id="k_reason" name="reason" required maxlength="300"></textarea></div>
    <p id="k_err" class="msg error" role="alert" hidden></p>
    <div class="foot">
      <button type="button" class="btn secondary" id="k_back">Close</button>
      <button type="submit" class="btn" id="k_submit">Save status</button>
    </div>
  </form>
</dialog>

<dialog id="adlg" aria-labelledby="adlg-h">
  <form id="aform" method="dialog" novalidate>
    <h2 id="adlg-h"></h2>
    <div id="afields" style="display:grid;gap:var(--s3)"></div>
    <p id="a_err" class="msg error" role="alert" hidden></p>
    <div class="foot">
      <button type="button" class="btn secondary" id="a_back">Close</button>
      <button type="submit" class="btn" id="a_submit">Save</button>
    </div>
  </form>
</dialog>

<noscript><p style="padding:2rem">The staff app needs JavaScript.</p></noscript>
<script nonce="__NONCE__">

const STATUS_CLASS = { Confirmed: "booked", "Checked-In": "occupied", "Checked-Out": "neutral", Cancelled: "blocked", "No-Show": "maintenance" };

const loading = () => h("div", { role: "status", "aria-label": "Loading" }, [1, 2, 3].map(() => h("div", { class: "skeleton" })));

const badge = (cls, text) => h("span", { class: "badge s-" + cls }, text);

const can = (k) => S.meta.can[k];

// ---------- chrome, routing ----------
const VIEWS = { today: ["Today", todayView], desk: ["Front desk", deskView], bookings: ["Bookings", bookingsView], callbacks: ["Call-backs", callbacksView], calendar: ["Calendar", calendarView], rooms: ["Rooms", roomsView],
  housekeeping: ["Housekeeping", housekeepingView], status: ["Room status", statusView], payments: ["Payments", paymentsView], messages: ["Messages", messagesView], notices: ["Notices", noticesView], feedback: ["Feedback", feedbackView], broadcasts: ["Broadcasts", broadcastsView], reports: ["Reports", reportsView], audit: ["Audit log", auditView], admin: ["Admin", adminView], settings: ["Account security", accountView] };

async function accountView(root) {
  const t = S.meta.totp, err = h("p", { class: "msg error", role: "alert", hidden: true }), setup = h("div");
  const show = (x) => { err.textContent = x.message; err.hidden = false; };
  const pw = h("form", { class: "card", "aria-label": "Change password", style: "display:grid;gap:1rem;max-width:30rem" }, h("h2", null, "Change password"),
    h("div", null, h("label", { for: "pw_cur", class: "req" }, "Current password"), h("input", { id: "pw_cur", type: "password", required: true, autocomplete: "current-password" })),

    h("button", { class: "btn", type: "submit" }, "Change password"));

    e.preventDefault(); err.hidden = true;

    const start = h("form", { style: "display:grid;gap:.5rem" }, h("div", null, h("label", { for: "tp_pw", class: "req" }, "Your password"), h("input", { id: "tp_pw", type: "password", required: true, autocomplete: "current-password" })), h("button", { class: "btn", type: "submit" }, "Get a key"));
    start.addEventListener("submit", async (e) => {

        const form = h("form", { style: "display:grid;gap:.5rem" }, h("p", null, "In the app choose Add account, then Enter a setup key, and type this key (spaces do not matter):"),

function bookingActions(b, today) {
  const btn = (label, cls, fn) => h("button", { class: "btn small " + cls, type: "button", "aria-label": `${label} booking ${b.id}, ${b.guest_name}`, onclick: fn }, label);
  const out = [];
  if (b.status === "Confirmed") {
    if (b.check_in <= today && today < b.check_out) out.push(btn("Check in", "", () => act(b, "checkin", "Checked in.")));
    if (b.check_in <= today) out.push(btn("No-show", "secondary", () => act(b, "noshow", "Marked as no-show.")));
    out.push(btn("Cancel", "danger", () => openCancel(b)));

async function act(b, action, done, body) {
  try { await api(`/api/bookings/${b.id}/${action}`, body || {}); toast(`Booking #${b.id}: ${done}`); route(); }
  catch (e) { toast(e.message); }

// ---------- views ----------
const alertBanner = (list) => list && list.length ? h("div", { class: "msg error", role: "alert" }, h("strong", null, list.length === 1 ? "Needs attention" : `${list.length} things need attention`),
  h("ul", { class: "plain", style: "margin:.5rem 0 0 1.25rem" }, list.map((a) => h("li", null, a.message, a.emailed_at ? null : h("div", { class: "small muted" }, "Not emailed: " + (a.email_note || "email pending")))))) : null;
const backupLine = (b) => h("p", { class: "small " + (b && !b.ok ? "msg error" : "muted"), role: b && !b.ok ? "alert" : null },
  b ? ["Last backup: ", fmtWhen(b.ts), " ", h("strong", null, b.ok ? "OK" : "FAILED"), b.ok ? null : " (" + b.detail + ")"] : "Last backup: none yet. Run the backup command (see workflows/mantralayam_staff.md).");
async function todayView(root) {
  const load = async () => {
    const d = await api("/api/dashboard?" + qs({ property_id: S.prop }));
    const card = (n, l, warn) => h("li", { class: warn && n ? "warn" : "" }, h("strong", null, n), h("span", null, l));
    out.replaceChildren(...[alertBanner(d.alerts), "backup" in d ? backupLine(d.backup) : null,
      h("ul", { class: "counts", "aria-label": "Today at a glance" }, card(d.arrivals.length, "Arrivals today"), card(d.overdue.length, "Late arrivals to resolve", true),
        card(d.inhouse.length + d.due_out.length, "Guests in house"), card(d.due_out.length, "Due out", true), card(`${d.rooms.available || 0} of ${d.total_rooms}`, "Rooms available now")),
      ...[d.overdue.length ? bookingTable(d.overdue, "Late arrivals (check-in date has passed)", "") : null,
      bookingTable(d.arrivals, "Arrivals today", "No arrivals expected today."),
      bookingTable(d.due_out, "Due out today or overdue", "No guests are due out."),
      bookingTable(d.inhouse, "In house", "No guests are checked in.")].filter(Boolean)].filter(Boolean));
  };
  const out = h("div", { style: "display:grid;gap:1.5rem" }, loading());

    h("div", { class: "toolbar" }, propSelect(() => { out.replaceChildren(loading()); load().catch((e) => out.replaceChildren(fail(e, load))); }),
      can("book") ? h("button", { class: "btn", type: "button", onclick: () => openBook() }, "New walk-in booking") : null)), out);

  try {
    const rooms = await api("/api/rooms?" + qs({ property_id: propEl.value, date }));
    roomEl.replaceChildren(...rooms.map((r) => opt(r.id, `Room ${r.number} · ${r.type} (sleeps ${r.capacity}) · ${ROOM_LABEL[r.status]}`, keep)));
  } catch (e) { roomEl.replaceChildren(opt("", "Could not load rooms")); }
};
function openBook(room, pre) {  // pre: a call-back request, pre-fills the dates, name and phone
  const t = S.meta.today, f = $("#bform"), props = S.meta.properties;
  f.reset(); $("#b_err").hidden = true;
  $("#b_prop").replaceChildren(...props.map((p) => opt(p.id, p.name, room ? room.property_id : (pre && pre.property_id) || S.prop || props[0].id)));
  $("#b_idtype").replaceChildren(...S.meta.id_types.map((x) => opt(x, x)));
  const ci = pre && pre.check_in ? (pre.check_in < t ? t : pre.check_in) : room ? S.date || t : t;
  $("#b_in").min = t; $("#b_in").value = ci; $("#b_out").value = pre && pre.check_out && pre.check_out > ci ? pre.check_out : addDay(ci, 1); $("#b_out").min = addDay(ci, 1);
  $("#b_darshan").min = t;
  if (pre) { $("#b_name").value = pre.name; $("#b_phone").value = pre.phone; }
  fillRooms($("#b_prop"), $("#b_room"), $("#b_in").value, room && room.id);
  $("#b_alt").hidden = true; $("#b_alt").replaceChildren(); askAvail();
  $("#bdlg").showModal();
}
const addDay = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
// No room free for the whole stay: offer nearby dates (the server only looks at the user's own properties)
let availSeq = 0;
async function checkAvail() {
  const box = $("#b_alt"), seq = ++availSeq, a = $("#b_in").value, z = $("#b_out").value;
  box.hidden = true; box.replaceChildren();
  if (!a || !z || z <= a || a < S.meta.today) return;
  try {
    const r = await api("/api/availability?" + qs({ property_id: $("#b_prop").value, check_in: a, check_out: z, guests: $("#b_guests").value || 1 }));
    if (seq !== availSeq || r.free) return;
    box.replaceChildren(h("div", { class: "msg" }, h("p", null, "No room for this party is free on these dates."),
      r.alternatives.length ? h("div", { role: "group", "aria-label": "Nearby dates with a room free" }, h("p", { class: "small" }, "Nearby dates with a room free:"),
        h("div", { class: "toolbar" }, r.alternatives.map((x) => h("button", { class: "btn small secondary", type: "button", "aria-label": `Use ${x.nights} night${x.nights > 1 ? "s" : ""}, ${fmtDate(x.check_in)} to ${fmtDate(x.check_out)}`,
          onclick: () => { $("#b_out").value = x.check_out; $("#b_in").value = x.check_in; $("#b_in").dispatchEvent(new Event("change")); $("#b_in").focus(); } },
          `${x.nights} night${x.nights > 1 ? "s" : ""} free from ${fmtDate(x.check_in)}`)))) : h("p", { class: "small" }, "Nothing is free within 14 days either side.")));
    box.hidden = false;
  } catch { /* the server still checks the booking itself */ }
}
let availTimer = 0;
const askAvail = () => { clearTimeout(availTimer); availTimer = setTimeout(checkAvail, 300); };
$("#b_prop").addEventListener("change", () => { fillRooms($("#b_prop"), $("#b_room"), $("#b_in").value); askAvail(); });
$("#b_in").addEventListener("change", () => { const a = $("#b_in").value; if (!a) return; $("#b_out").min = addDay(a, 1); if ($("#b_out").value <= a) $("#b_out").value = addDay(a, 1); fillRooms($("#b_prop"), $("#b_room"), a, $("#b_room").value); askAvail(); });
$("#b_out").addEventListener("change", askAvail);
$("#b_guests").addEventListener("input", askAvail);
$("#b_back").onclick = () => $("#bdlg").close();
$("#bform").addEventListener("submit", async (e) => {
  e.preventDefault(); const btn = $("#b_submit"), err = $("#b_err"); err.hidden = true;
  if (!$("#bform").reportValidity()) return;
  btn.disabled = true; btn.textContent = "Saving…";
  try { const b = await api("/api/bookings", Object.fromEntries(new FormData($("#bform")))); $("#bdlg").close(); toast(`Booking #${b.id} created for ${b.guest_name}, room ${b.room}.`); route(); }
  catch (x) { err.textContent = x.message; err.hidden = false; err.scrollIntoView({ block: "nearest" }); }
  finally { btn.disabled = false; btn.textContent = "Create booking"; }
});

let cb = null;
function openCancel(b) { cb = b; $("#c_reason").value = ""; $("#c_err").hidden = true; $("#c_intro").textContent = `Booking #${b.id}: ${b.guest_name}, room ${b.room}, ${fmtDate(b.check_in)} to ${fmtDate(b.check_out)}.`; $("#cdlg").showModal(); }
$("#c_back").onclick = () => $("#cdlg").close();
$("#cform").addEventListener("submit", async (e) => {
  e.preventDefault(); const btn = $("#c_submit"); btn.disabled = true; $("#c_err").hidden = true;
  try { await api(`/api/bookings/${cb.id}/cancel`, { reason: $("#c_reason").value }); $("#cdlg").close(); toast(`Booking #${cb.id} cancelled.`); route(); }
  catch (x) { $("#c_err").textContent = x.message; $("#c_err").hidden = false; }
  finally { btn.disabled = false; }
});

function syncKind() {
  const k = $("#k_kind").value, block = k === "internal_block";
  $("#k_cat_box").hidden = block; $("#k_cat").required = !block;
  $("#k_end").required = k !== "out_of_service";
  $("#k_end_l").textContent = k === "out_of_service" ? "Available again on (optional)" : "Available again on *";
}
function openStatus() {
  const f = $("#kform"), props = S.meta.properties; f.reset(); $("#k_err").hidden = true;
  $("#k_prop").replaceChildren(...props.map((p) => opt(p.id, p.name, S.prop || props[0].id)));
  $("#k_kind").replaceChildren(...S.meta.kinds.map((k) => opt(k, KIND_LABEL[k])));
  $("#k_cat").replaceChildren(...S.meta.issues.map((x) => opt(x, x)));
  $("#k_start").value = $("#k_start").min = S.meta.today; syncKind();
  fillRooms($("#k_prop"), $("#k_room"), S.meta.today);
  $("#kdlg").showModal();
}
$("#k_kind").addEventListener("change", syncKind);
$("#k_prop").addEventListener("change", () => fillRooms($("#k_prop"), $("#k_room"), S.meta.today));
$("#k_back").onclick = () => $("#kdlg").close();
$("#kform").addEventListener("submit", async (e) => {
  e.preventDefault(); const btn = $("#k_submit"); $("#k_err").hidden = true;
  if (!$("#kform").reportValidity()) return;
  btn.disabled = true;
  try { await api("/api/room_events", Object.fromEntries(new FormData($("#kform")))); $("#kdlg").close(); toast("Room status saved."); route(); }
  catch (x) { $("#k_err").textContent = x.message; $("#k_err").hidden = false; }
  finally { btn.disabled = false; }
});

route();
</script>
</body>
